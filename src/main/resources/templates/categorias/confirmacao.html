<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Categoria</title>
</head>
<body>

<h1>Editar Categoria</h1>

<form th:action="@{/categorias/editar/{id}(id=${categoria.id})}"
      th:object="${categoria}"
      method="post">

    <label>Nome:</label>
    <input type="text" th:field="*{nome}" required>

    <br><br>

    <button type="submit">Salvar Alterações</button>

</form>

<br>

<a th:href="@{/categorias}">Cancelar</a>

</body>
</html>
