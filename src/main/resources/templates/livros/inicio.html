<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Biblioteca - Livros</title>
</head>

<body>

<h1>Gerenciamento de Livros</h1>

<a th:href="@{/livros/novo}">Cadastrar novo livro</a>

<hr>

<h2>Livros cadastrados</h2>

<p th:if="${#lists.isEmpty(livros)}">
    Nenhum livro cadastrado.
</p>

<table border="1" th:unless="${#lists.isEmpty(livros)}">

    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
        <th>Ações</th>
        <th>Categoria</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="livro : ${livros}">

        <td th:text="${livro.id}"></td>

        <td th:text="${livro.titulo}"></td>

        <td th:text="${livro.autor}"></td>

        <td th:text="${livro.isbn}"></td>

        <td th:text="${livro.categoria != null ? livro.categoria.nome : 'Sem categoria'}"></td>

        <td>

            <form th:action="@{/livros/excluir/{id}(id=${livro.id})}"
                  method="post"
                  style="display:inline"
                  onsubmit="return confirm('Deseja excluir este livro?');">

                <button type="submit">Excluir</button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

<br>

<a th:href="@{/}">Voltar ao início</a>

</body>
</html>
