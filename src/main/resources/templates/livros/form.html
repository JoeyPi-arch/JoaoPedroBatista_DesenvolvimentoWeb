
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>
</head>
<body>

<h1>Cadastrar Livro</h1>

<p th:if="${param.erro}" style="color:red;">
    Selecione uma categoria válida.
</p>

<form th:action="@{/livros}"
      th:object="${livro}"
      method="post">

    <label>Título:</label>
    <input type="text" th:field="*{titulo}" required>

    <br><br>

    <label>Autor:</label>
    <input type="text" th:field="*{autor}" required>

    <br><br>

    <label>ISBN:</label>
    <input type="text" th:field="*{isbn}" required>

    <br><br>

    <label>Categoria:</label>

    <select th:field="*{categoriaId}" required>
        <option value="">Selecione uma categoria</option>

        <option th:each="categoria : ${categorias}"
                th:value="${categoria.id}"
                th:text="${categoria.nome}">
        </option>
    </select>

    <br><br>

    <button type="submit">Cadastrar Livro</button>

</form>

<br>

<a th:href="@{/livros}">Voltar</a>

</body>
</html>
