<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Autores</title>
</head>

<body>

<h1 th:text="${autor.id == null} ? 'Cadastrar Autor' : 'Editar Autor'">
    Cadastrar Autor
</h1>

<form th:action="${autor.id == null} ?
      @{/autores} :
      @{/autores/editar/{id}(id=${autor.id})}"
      th:object="${autor}"
      method="post">

    <label>Nome:</label>
    <input type="text" th:field="*{nome}" required>

    <br><br>

    <label>Nacionalidade:</label>
    <input type="text" th:field="*{nacionalidade}" required>

    <br><br>

    <label>E-mail:</label>
    <input type="email" th:field="*{email}" required>

    <br><br>

    <button type="submit"
            th:text="${autor.id == null} ? 'Cadastrar' : 'Salvar Alterações'">
        Cadastrar
    </button>

</form>

<br>

<a th:href="@{/autores}">Voltar à listagem</a>

</body>
</html>
